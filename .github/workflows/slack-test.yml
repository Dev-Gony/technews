name: Tech news test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tech-news-bot
  cancel-in-progress: false

jobs:
  tech-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tech news bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Save sent article history
        run: |
          if git diff --quiet sent_articles.json; then
            echo "No new article history to save."
            exit 0
          fi

          git config user.name "tech-news-bot"
          git config user.email "tech-news-bot@users.noreply.github.com"

          git add sent_articles.json
          git commit -m "Update sent article history"

          git pull --rebase origin main
          git push origin main
