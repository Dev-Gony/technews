name: Daily Shorts

on:
  workflow_dispatch:
    inputs:
      date:
        description: "이슈 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false
      upload:
        description: "YouTube에 업로드"
        type: boolean
        default: true

  workflow_run:
    workflows:
      - "Daily Tech News"
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tech-news-bot
  cancel-in-progress: false

jobs:
  shorts:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make shorts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_UPLOAD: ${{ github.event.inputs.upload }}
        run: |
          args=()

          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi

          if [ "$INPUT_UPLOAD" = "false" ]; then
            args+=(--no-upload)
          fi

          python shorts.py "${args[@]}"

      - name: Keep video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: |
            runtime/shorts/*/short.mp4
            runtime/shorts/*/script.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save shorts history
        run: |
          if [ ! -f config/shorts_history.json ]; then
            echo "No shorts history to save."
            exit 0
          fi

          git add config/shorts_history.json

          if git diff --cached --quiet; then
            echo "No shorts history changes to save."
            exit 0
          fi

          git config user.name "tech-news-bot"
          git config user.email "tech-news-bot@users.noreply.github.com"

          git commit -m "Update shorts history"

          git pull --rebase origin main
          git push origin main
