name: Daily Shorts

on:
  workflow_dispatch:
    inputs:
      date:
        description: "이슈 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false
      upload:
        description: "YouTube에 업로드"
        type: boolean
        default: true
      link:
        description: "이 기사로 만들기 (테스트용, 비우면 자동 선택)"
        required: false
      theme:
        description: "배경 테마 (비우면 기본값)"
        required: false
        type: choice
        options: ["", "ink", "paper"]
      script:
        description: "Claude 대신 이 대본 JSON 파일로 만들기 (테스트용, 레포 안 경로)"
        required: false
      thumbnail_only:
        description: "이미 올린 영상 ID에 script 대본으로 만든 썸네일만 적용 (영상은 안 만듦)"
        required: false

  # 하루 6편(최대). 실행할 때마다 최근 이슈에서 아직 안 만든 기사 1개로 1편을 만든다.
  # YouTube API 하루 한도 10,000 중 업로드 1번이 1,600이라 6편이 최대다.
  # 한도는 미국 태평양 시간 자정(한국 17:00)에 초기화되므로, 그 사이에 6번이 고르게 들어가도록 3시간 간격.
  # 만들 기사가 없으면 아무것도 하지 않고 끝난다.
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Seoul"
    - cron: "0 10 * * *"
      timezone: "Asia/Seoul"
    - cron: "0 13 * * *"
      timezone: "Asia/Seoul"
    - cron: "0 16 * * *"
      timezone: "Asia/Seoul"
    - cron: "0 19 * * *"
      timezone: "Asia/Seoul"
    - cron: "0 22 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: tech-news-bot
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 예약 실행은 main, 수동 실행은 고른 브랜치를 받는다(브랜치에서 미리 테스트 가능).
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install video renderer (Remotion)
        working-directory: video
        run: |
          npm ci
          npx remotion browser ensure

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # 자막 타이밍용 음성 인식 모델(Whisper)을 매번 받지 않게 캐시한다.
      - name: Cache speech recognition model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Make shorts
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_UPLOAD: ${{ github.event.inputs.upload }}
          INPUT_LINK: ${{ github.event.inputs.link }}
          INPUT_SCRIPT: ${{ github.event.inputs.script }}
          INPUT_THUMBNAIL_ONLY: ${{ github.event.inputs.thumbnail_only }}
          SHORTS_THEME: ${{ github.event.inputs.theme }}
        run: |
          args=()

          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi

          if [ -n "$INPUT_LINK" ]; then
            args+=(--link "$INPUT_LINK")
          fi

          if [ -n "$INPUT_SCRIPT" ]; then
            args+=(--script "$INPUT_SCRIPT")
          fi

          if [ -n "$INPUT_THUMBNAIL_ONLY" ]; then
            args+=(--thumbnail-only "$INPUT_THUMBNAIL_ONLY")
          fi

          if [ "$INPUT_UPLOAD" = "false" ]; then
            args+=(--no-upload)
          fi

          python shorts.py "${args[@]}"

      - name: Keep video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: |
            runtime/shorts/*/short.mp4
            runtime/shorts/*/script.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save shorts history
        # 다른 브랜치에서 수동 테스트한 결과를 main에 밀어 넣지 않는다.
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f config/shorts_history.json ]; then
            echo "No shorts history to save."
            exit 0
          fi

          git add config/shorts_history.json

          if git diff --cached --quiet; then
            echo "No shorts history changes to save."
            exit 0
          fi

          git config user.name "tech-news-bot"
          git config user.email "tech-news-bot@users.noreply.github.com"

          git commit -m "Update shorts history"

          git pull --rebase origin main
          git push origin main
