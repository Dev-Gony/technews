name: Apply GeekNews feed fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-geeknews-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch GeekNews handling and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('main.py')
          text = main_path.read_text(encoding='utf-8')

          old_feed = '"rss": "https://news.hada.io/rss/news",'
          new_feed = '"rss": "https://feeds.feedburner.com/geeknews-feed",'
          if old_feed not in text:
              raise SystemExit('GeekNews RSS URL pattern not found')
          text = text.replace(old_feed, new_feed, 1)

          marker = '''def get_rss_articles(\n    blog,\n    limit\n):\n'''
          helper = '''def get_entry_link(\n    entry,\n    blog\n):\n    candidates = []\n\n    if blog.get("name") == "GeekNews":\n        for item in entry.get(\n            "links",\n            []\n        ):\n            if not isinstance(\n                item,\n                dict\n            ):\n                continue\n\n            rel = item.get(\n                "rel",\n                "alternate"\n            )\n\n            href = item.get(\n                "href",\n                ""\n            )\n\n            if (\n                rel == "alternate"\n                and href\n            ):\n                candidates.append(\n                    href\n                )\n\n        candidates.extend(\n            [\n                entry.get(\n                    "link",\n                    ""\n                ),\n                entry.get(\n                    "id",\n                    ""\n                ),\n            ]\n        )\n\n    else:\n        candidates.append(\n            entry.get(\n                "link",\n                ""\n            )\n        )\n\n    for candidate in candidates:\n        if not candidate:\n            continue\n\n        normalized = normalize_article_url(\n            candidate\n        )\n\n        if normalized:\n            return normalized\n\n    return ""\n\n\n'''
          if marker not in text:
              raise SystemExit('get_rss_articles marker not found')
          text = text.replace(marker, helper + marker, 1)

          old_link = '''        link = normalize_article_url(\n            entry.get(\n                "link",\n                ""\n            )\n        )\n'''
          new_link = '''        link = get_entry_link(\n            entry,\n            blog\n        )\n'''
          if old_link not in text:
              raise SystemExit('RSS link extraction pattern not found')
          text = text.replace(old_link, new_link, 1)

          main_path.write_text(text, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          anchor = 'GeekNews는 기업 기술 블로그 외의 새로운 기술 콘텐츠를 발견하기 위한 보조 큐레이션 소스로 사용합니다.\n'
          addition = '''\n#### GeekNews 수집 방식\n\nGeekNews는 일반 기업 블로그와 달리 FeedBurner의 공개 Atom 피드(`https://feeds.feedburner.com/geeknews-feed`)를 사용합니다.\n\nAtom 항목의 링크 형식 차이로 인해 GeekNews만 링크를 별도로 정규화합니다. 링크 후보는 `rel=alternate`의 `href`를 가장 먼저 사용하고, 없으면 `entry.link`, 마지막으로 `entry.id`를 fallback으로 사용합니다. 이렇게 얻은 URL도 기존 `normalize_article_url()`을 거쳐 `topic?id=` 식별자는 유지하면서 추적용 Query Parameter는 제거합니다.\n\n`NomaDamas/k-skill`의 `geeknews-search` 구현도 동일한 공개 FeedBurner 피드를 사용하는 것을 확인했지만, 이 프로젝트에서는 해당 Skill/CLI를 런타임 의존성으로 추가하지 않았습니다. Tech News Bot 자체의 Python 수집 흐름 안에서 직접 처리해 GitHub Actions 의존성과 운영 복잡도를 늘리지 않는 방향을 선택했습니다.\n'''
          if anchor not in readme:
              raise SystemExit('README GeekNews anchor not found')
          if '#### GeekNews 수집 방식' not in readme:
              readme = readme.replace(anchor, anchor + addition, 1)
          readme_path.write_text(readme, encoding='utf-8')

          devlog_path = Path('DEVLOG.md')
          devlog = devlog_path.read_text(encoding='utf-8')
          entry = '''\n\n---\n\n## 2026-09-14. GeekNews Feed/Atom 링크 처리 안정화\n\n### 문제\n\nGeekNews를 일반 RSS 소스와 같은 방식으로 처리하면서 `entry.link`만 신뢰하고 있었습니다. GeekNews는 Atom 구조를 사용하고 링크 정보가 `links` 배열의 `rel=alternate`에 들어갈 수 있어, 피드 형식 변화에 따라 링크를 안정적으로 얻지 못할 가능성이 있었습니다.\n\n또한 기존 설정은 `https://news.hada.io/rss/news`를 사용하고 있었습니다. 별도 구현을 조사하는 과정에서 `NomaDamas/k-skill`의 `geeknews-search`가 GeekNews 공개 FeedBurner Atom 피드(`https://feeds.feedburner.com/geeknews-feed`)를 읽기 전용 소스로 사용하는 것을 확인했습니다.\n\n### 해결\n\nGeekNews만 다음 순서로 링크를 찾도록 전용 fallback을 추가했습니다.\n\n    Atom rel=alternate href\n    → entry.link\n    → entry.id\n    → normalize_article_url()\n\n그리고 GeekNews RSS 주소를 공개 FeedBurner 피드로 변경했습니다.\n\n`k-skill` 자체를 프로젝트 의존성으로 추가하지는 않았습니다. 이 봇은 30여 개 소스를 주기적으로 수집하고 신규 판별, 중복 제거, Gemini 선별/요약, Slack 발송, 처리 이력 저장까지 수행하는 운영 자동화이므로, GeekNews 조회용 CLI를 중간에 추가하면 Node/npx 의존성과 실패 지점만 늘어나기 때문입니다.\n\n### 결과\n\n- 기존 `feedparser` 기반 공통 RSS 구조 유지\n- GeekNews에만 Atom 링크 fallback 적용\n- 외부 Skill/CLI 런타임 의존성 없음\n- 기존 신규 글 판별 및 `sent_articles.json` 중복 방지 흐름 그대로 사용\n\n장애 확인 시 GeekNews 항목의 `title`, `link`, `links`, `id` 순으로 확인하면 됩니다.\n'''
          if '## 2026-09-14. GeekNews Feed/Atom 링크 처리 안정화' not in devlog:
              devlog = devlog.rstrip() + entry + '\n'
          devlog_path.write_text(devlog, encoding='utf-8')
          PY

          python -m py_compile main.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f .github/workflows/apply-geeknews-fix.yml
          git add main.py README.md DEVLOG.md .github/workflows/apply-geeknews-fix.yml
          git commit -m "fix: stabilize GeekNews Atom feed handling"
          git pull --rebase origin main
          git push origin main
