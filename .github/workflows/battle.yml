name: AI Battle Shorts

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "YouTube에 업로드"
        type: boolean
        default: true
      id:
        description: "이 문제로 만들기 (config/battles.json의 id, 비우면 아직 안 쓴 첫 문제)"
        required: false
  # AI 대결 쇼츠 (battle.py): 하루 1편, 12시 공개. 08:47에 만들어 예약 공개한다.
  schedule:
    - cron: "47 8 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: tech-news-bot
  cancel-in-progress: false

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 예약 실행은 main, 수동 실행은 고른 브랜치를 받는다(브랜치에서 미리 테스트 가능).
      - name: Download repository
        uses: actions/checkout@v7

      # 실행이 줄 서 있다 시작되면 체크아웃은 "실행을 예약한 시점"의 코드라서,
      # 앞 실행이 방금 올린 영상 기록이 빠져 있다(→ 같은 기사로 또 만듦). 기록 파일만 최신 main으로 맞춘다.
      - name: Use the latest shorts history
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- config/shorts_history.json || echo "No shorts history on main yet."

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install video renderer (Remotion)
        working-directory: video
        run: |
          npm ci
          npx remotion browser ensure

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # 자막 타이밍용 음성 인식 모델(Whisper)을 매번 받지 않게 캐시한다.
      - name: Cache speech recognition model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Make AI battle short
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SHORTS_THUMBNAIL: ${{ vars.SHORTS_THUMBNAIL }}
          # 쇼츠(18시)와 겹치지 않게 12시에 공개
          SHORTS_PUBLISH_SLOTS: "12"
          INPUT_UPLOAD: ${{ github.event.inputs.upload }}
          INPUT_ID: ${{ github.event.inputs.id }}
        run: |
          args=()

          if [ -n "$INPUT_ID" ]; then
            args+=(--id "$INPUT_ID")
          fi

          if [ "$INPUT_UPLOAD" = "false" ]; then
            args+=(--no-upload)
          fi

          python battle.py "${args[@]}"

      - name: Keep video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battle
          path: |
            runtime/battle/*/short.mp4
            runtime/battle/*/script.json
            runtime/battle/*/answers.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save shorts history
        # 다른 브랜치에서 수동 테스트한 결과를 main에 밀어 넣지 않는다.
        if: github.ref == 'refs/heads/main'
        run: |
          if [ ! -f config/shorts_history.json ]; then
            echo "No shorts history to save."
            exit 0
          fi

          git config user.name "tech-news-bot"
          git config user.email "tech-news-bot@users.noreply.github.com"
          cp config/shorts_history.json /tmp/my_history.json

          # 그사이 다른 실행이 기록을 올렸으면 충돌 대신 두 기록을 합친다 (video_id, 없으면 링크 기준). 최대 3번 시도.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            python - <<'PY'
          import json, os
          path = "config/shorts_history.json"
          latest = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else []
          mine = json.load(open("/tmp/my_history.json", encoding="utf-8"))
          # 건너뛴 기사(팩트체크 실패)는 video_id가 없어 링크로 구분한다.
          key = lambda entry: entry.get("video_id") or ("skip", entry.get("link"))
          known = {key(entry) for entry in latest}
          merged = latest + [entry for entry in mine if key(entry) not in known]
          with open(path, "w", encoding="utf-8") as file:
              json.dump(merged, file, ensure_ascii=False, indent=2)
              file.write("\n")
          print(f"history: {len(latest)} -> {len(merged)}")
          PY

            git add config/shorts_history.json

            if git diff --cached --quiet; then
              echo "No shorts history changes to save."
              exit 0
            fi

            git commit -m "Update shorts history"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed, retrying ($attempt)"
            sleep 5
          done

          exit 1
