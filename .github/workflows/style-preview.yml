# 임시: news/explain 스타일 스틸 확인용. 확인이 끝나면 지운다.
name: Style preview (temporary)

on:
  push:
    branches: ["claude/editorial-styles"]
  workflow_dispatch:
    inputs:
      run_id:
        description: "프레임을 뽑을 Daily Shorts 실행 ID (비우면 샘플 스틸)"
        required: false

permissions:
  contents: write

jobs:
  frames:
    if: github.event.inputs.run_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shorts
          path: art
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Extract frames
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p out
          video=$(find art -name short.mp4 | head -1)
          cp "$(dirname "$video")/script.json" out/ || true
          ffmpeg -loglevel error -i "$video" -vf "fps=1/2,scale=360:-1,tile=6x3" -frames:v 1 out/contact.png
          for t in 1 4 8 12 16 20 24 28; do ffmpeg -loglevel error -ss $t -i "$video" -frames:v 1 -vf scale=540:-1 out/t$t.png; done
          cd out
          git init -q
          git config user.name "tech-news-bot"
          git config user.email "tech-news-bot@users.noreply.github.com"
          git checkout -q -b preview/run-frames
          git add -A
          git commit -q -m "frames ${{ github.event.inputs.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview/run-frames

  stills:
    if: github.event.inputs.run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
      - name: Install
        working-directory: video
        run: |
          npm ci
          npx remotion browser ensure
      - name: Type check
        working-directory: video
        run: npx tsc --noEmit 2>&1 | tee ../tsc.log
      - name: Render stills
        working-directory: video
        run: |
          mkdir -p ../preview
          for f in 15 48 110 180 250 300; do
            npx remotion still src/index.ts ShortNews ../preview/news-$f.png --frame=$f --log=error
          done
          for f in 15 48 80 130 215 300; do
            npx remotion still src/index.ts ShortExplain ../preview/explain-$f.png --frame=$f --log=error
          done
      - name: Publish stills to preview branch
        if: always()
        run: |
          cp tsc.log preview/ 2>/dev/null || true
          cd preview
          git init -q
          git config user.name "tech-news-bot"
          git config user.email "tech-news-bot@users.noreply.github.com"
          git checkout -q -b preview/editorial-stills
          git add -A
          git commit -q -m "style preview stills ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" preview/editorial-stills
